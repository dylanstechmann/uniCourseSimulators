name: lattice-courselab

x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &api-env
    DATABASE_PASSWORD_FILE: /run/courselab/db-password
    DB_HOST: db
    DB_NAME: courselab
    DB_USER: courselab
    CONTENT_ROOT: /content
    COOKIE_SECURE: "false"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  volumes:
    - credentials:/run/courselab:ro
  networks: [database, application]
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  credentials:
    image: alpine:3.22
    command: [sh, -ec, "umask 077; if [ ! -s /secrets/db-password ]; then head -c 32 /dev/urandom | base64 > /secrets/db-password; fi; chown 10001:10001 /secrets/db-password; chmod 0440 /secrets/db-password"]
    volumes: [credentials:/secrets]
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courselab
      POSTGRES_USER: courselab
      POSTGRES_PASSWORD_FILE: /run/courselab/db-password
    volumes:
      - database:/var/lib/postgresql/data
      - credentials:/run/courselab:ro
    networks: [database]
    depends_on:
      credentials: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U courselab -d courselab"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  web:
    build: ./frontend
    ports: ["127.0.0.1:${COURSELAB_PORT:-8080}:80"]
    networks: [application]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]

networks:
  database: {internal: true}
  application: {}
volumes:
  database: {}
  credentials: {}
