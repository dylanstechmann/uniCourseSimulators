name: uniStemCourseSimulators validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  content-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r requirements-dev.txt -r backend/requirements.txt
      - run: python tools/validate_content.py
      - run: python -m pytest tests -q
      - run: npm run test:legacy
      - run: python tools/check_security.py
      - run: ruff check backend tools tests
      - run: cd backend && python -m pytest -q
  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      INSTRUCTOR_EMAILS: courselab-reviewer@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
      - run: python tools/check_security.py --bundle frontend/dist
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > /tmp/courselab-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/courselab-compose.log
      - if: always()
        run: docker compose down
